name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: python -m pytest

  bandit-security-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r . --exclude ./.venv,./.git,./__pycache__,./.pytest_cache --severity-level medium

  docker-build:
    name: Docker Build
    needs: [pytest, bandit-security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t ejercicio-docker-audit:${{ github.sha }} .

      - name: Save image for next jobs
        run: docker save ejercicio-docker-audit:${{ github.sha }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  trivy-vulnerability-scan:
    name: Trivy Vulnerability Scan
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: ejercicio-docker-audit:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

  publish-to-ghcr:
    name: Publish to GHCR
    needs: trivy-vulnerability-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push image
        run: |
          IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Publicando como: $IMAGE_NAME"
          
          docker tag ejercicio-docker-audit:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}
          docker tag ejercicio-docker-audit:${{ github.sha }} $IMAGE_NAME:latest
          
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest